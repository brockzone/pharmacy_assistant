<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" fill="none">
  <rect width="1200" height="250" rx="20" fill="#F4F7FB"/>
  <text x="52" y="46" fill="#172B4D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">A CLEAR, REVIEW-FIRST FLOW</text>

  <path d="M296 142H334M581 142H619M866 142H904" stroke="#A9B8C9" stroke-width="2" stroke-linecap="round"/>
  <path d="M327 136L334 142L327 148M612 136L619 142L612 148M897 136L904 142L897 148" stroke="#7186A0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <g>
    <rect x="52" y="76" width="244" height="132" rx="14" fill="#FFFFFF" stroke="#DFE7F0"/>
    <circle cx="82" cy="108" r="16" fill="#E5F8F5"/>
    <path d="M76 108H88M82 102V114" stroke="#149B8D" stroke-width="2" stroke-linecap="round"/>
    <text x="108" y="106" fill="#73849A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1">01  CAPTURE</text>
    <text x="72" y="151" fill="#172B4D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">Freeze a frame</text>
    <text x="72" y="175" fill="#5F7187" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">Keep the live preview separate</text>
    <text x="72" y="192" fill="#5F7187" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">from the captured image.</text>
  </g>

  <g>
    <rect x="337" y="76" width="244" height="132" rx="14" fill="#FFFFFF" stroke="#DFE7F0"/>
    <circle cx="367" cy="108" r="16" fill="#EAF0FF"/>
    <path d="M360 108H374M367 101V115M362 103L372 113M372 103L362 113" stroke="#456FD4" stroke-width="1.5" stroke-linecap="round"/>
    <text x="393" y="106" fill="#73849A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1">02  PROCESS</text>
    <text x="357" y="151" fill="#172B4D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">Prepare the image</text>
    <text x="357" y="175" fill="#5F7187" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">OpenCV creates the grayscale</text>
    <text x="357" y="192" fill="#5F7187" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">image used by the OCR pipeline.</text>
  </g>

  <g>
    <rect x="622" y="76" width="244" height="132" rx="14" fill="#FFFFFF" stroke="#DFE7F0"/>
    <circle cx="652" cy="108" r="16" fill="#F0EBFF"/>
    <path d="M645 102H659V114H645V102ZM648 106H656M648 110H654" stroke="#7655C7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="678" y="106" fill="#73849A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1">03  EXTRACT</text>
    <text x="642" y="151" fill="#172B4D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">Read and compare</text>
    <text x="642" y="175" fill="#5F7187" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">Tesseract reads text; SQLite</text>
    <text x="642" y="192" fill="#5F7187" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">finds possible catalog matches.</text>
  </g>

  <g>
    <rect x="907" y="76" width="244" height="132" rx="14" fill="#10213D"/>
    <circle cx="937" cy="108" r="16" fill="#FFFFFF" fill-opacity=".12"/>
    <path d="M930 108L935 113L944 103" stroke="#55D9C6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="963" y="106" fill="#AFC2D8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1">04  REVIEW</text>
    <text x="927" y="151" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">Human stays in control</text>
    <text x="927" y="175" fill="#C5D4E7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">Review OCR text and any</text>
    <text x="927" y="192" fill="#C5D4E7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">suggested match before use.</text>
  </g>
</svg>
